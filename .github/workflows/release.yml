name: Release

on:
  push:
    branches:
      - main
      # - ci

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    outputs:
      release_created: ${{ steps.release.outputs['crates/super--release_created'] }}
      tag_name: ${{ steps.release.outputs['crates/super--tag_name'] }}
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Release
        id: release
        uses: googleapis/release-please-action@v4
        with:
          # A token of its own, so its releases trigger other workflows (the Discord announcement):
          # GitHub doesn't for the built-in one
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release
    name: Target - ${{ matrix.platform.name }}
    if: ${{ needs.release.outputs.release_created }}
    strategy:
      matrix:
        platform:
          - name: super-linux-musl-x86_64
            os: ubuntu-latest
            image: rust:latest
            bin: super
            cross: true
            target: x86_64-unknown-linux-musl
            cargo_command: cross
          #
          - name: super-linux-musl-aarch64
            os: ubuntu-latest
            image: rust:latest
            cross: true
            bin: super
            target: aarch64-unknown-linux-musl
            cargo_command: cross
          #
          - name: super-linux-gnu-aarch64
            os: ubuntu-latest
            image: rust:latest
            cross: true
            bin: super
            target: aarch64-unknown-linux-gnu
            cargo_command: cross
          #
          - name: super-linux-gnu-x86_64
            os: ubuntu-latest
            image: rust:latest
            bin: super
            cross: true
            target: x86_64-unknown-linux-gnu
            cargo_command: cross
          #
          - name: super-macos-x86_64
            os: macos-latest
            image: rust:latest
            bin: super
            cross: false
            target: x86_64-apple-darwin
            cargo_command: cargo
          #
          - name: super-macos-aarch64
            os: macos-latest
            image: rust:latest
            cross: false
            bin: super
            target: aarch64-apple-darwin
            cargo_command: cargo
    runs-on: ${{ matrix.platform.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform.target }}
          cache-provider: github

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt,clippy
          target: ${{ matrix.platform.target }}
          cache: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the admin UI
        working-directory: crates/super_admin_ui
        run: npm ci && npm run build

      - name: Setup Cross
        # TODO: remove workaround once the issue is resolved: https://github.com/cross-rs/cross/issues/1561
        run: RUSTFLAGS="" cargo install cross --git https://github.com/cross-rs/cross
        if: ${{ matrix.platform.cross }}

      - name: Install musl-tools on Linux
        run: sudo apt-get update --yes && sudo apt-get install --yes musl-tools
        if: contains(matrix.platform.os, 'ubuntu')

      - name: Build binary (*nix)
        shell: bash
        if: contains(matrix.platform.os, 'ubuntu')
        run: |
          ${{ matrix.platform.cargo_command }} build -p super_proxy --release --target ${{ matrix.platform.target }}

      - name: Build binary (OSX)
        shell: bash
        if: contains(matrix.platform.os, 'macos')
        run: |
          ${{ matrix.platform.cargo_command }} build -p super_proxy --release --target ${{ matrix.platform.target }}

      - name: Package as archive
        shell: bash
        run: |
          cd target/${{ matrix.platform.target }}/release
          tar czvf ../../../${{ matrix.platform.name }}.tar.gz ${{ matrix.platform.bin }}

      - name: Upload artifacts (tar.gz)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}
          path: "super*"

  publish:
    name: Publish Docker images
    needs:
      - release
      - build
    permissions:
      contents: write
      pull-requests: write
    if: ${{ needs.release.outputs.release_created && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      # To run the arm64 image on the amd64 runner
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_SECRET }}

      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./data

      - name: List files
        run: |
          ls -R ./data

      # The static (musl) binaries don't depend on the image's glibc.
      # Each image is checked to start before it's pushed.
      - name: x86_64 Build Linux image
        run: |
          tar -xzvf ./data/super-linux-musl-x86_64/super-linux-musl-x86_64.tar.gz super
          docker buildx build --platform linux/amd64 -t luizfonseca/super:${{needs.release.outputs.tag_name}}-amd64 -f Dockerfile . --load
          docker run --rm --platform linux/amd64 luizfonseca/super:${{needs.release.outputs.tag_name}}-amd64 --version
          docker push luizfonseca/super:${{needs.release.outputs.tag_name}}-amd64

      - name: aarch64 Build Linux image
        run: |
          rm super
          tar -xzvf ./data/super-linux-musl-aarch64/super-linux-musl-aarch64.tar.gz super
          docker buildx build --platform linux/arm64 -t luizfonseca/super:${{needs.release.outputs.tag_name}}-arm64 -f Dockerfile . --load
          docker run --rm --platform linux/arm64 luizfonseca/super:${{needs.release.outputs.tag_name}}-arm64 --version
          docker push luizfonseca/super:${{needs.release.outputs.tag_name}}-arm64

      - name: Docker (latest)
        run: |
          docker buildx imagetools create -t luizfonseca/super:latest luizfonseca/super:${{needs.release.outputs.tag_name}}-amd64 luizfonseca/super:${{needs.release.outputs.tag_name}}-arm64

      - name: Docker (${{needs.release.outputs.tag_name}})
        run: |
          docker buildx imagetools create -t luizfonseca/super:${{needs.release.outputs.tag_name}} luizfonseca/super:${{needs.release.outputs.tag_name}}-amd64 luizfonseca/super:${{needs.release.outputs.tag_name}}-arm64

      - name: Replace The Relative Path In The README.md
        run: |
          sed -E 's#(\[[^]]*\])\(\.\/([^)]+)\)#\1(https://github.com/${{ github.repository }}/raw/${{ needs.release.outputs.tag_name }}/\2)#g' README.md > docker.README.md

      - name: Update Docker Images Description
        uses: peter-evans/dockerhub-description@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_SECRET }}
          repository: luizfonseca/super
          short-description: "Proksi on hyper: reverse proxy and load balancer with automatic HTTPS"
          readme-filepath: docker.README.md

  upload-artifacts:
    continue-on-error: true
    name: Upload artifacts to Release
    needs:
      - release
      - build
    if: ${{ needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Download workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./data

      - name: Upload Release Artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release.outputs.tag_name }} \
          ./data/super-linux-gnu-x86_64/super-linux-gnu-x86_64.tar.gz ./data/super-linux-gnu-aarch64/super-linux-gnu-aarch64.tar.gz  \
          ./data/super-macos-x86_64/super-macos-x86_64.tar.gz ./data/super-macos-aarch64/super-macos-aarch64.tar.gz \
          ./data/super-linux-musl-x86_64/super-linux-musl-x86_64.tar.gz ./data/super-linux-musl-aarch64/super-linux-musl-aarch64.tar.gz
