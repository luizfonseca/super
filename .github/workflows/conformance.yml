name: Conformance

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # The suites and the libraries change too
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    name: Conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the admin UI
        working-directory: crates/super_admin_ui
        run: npm ci && npm run build
      - run: make conformance.check
