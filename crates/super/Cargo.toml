[package]
name = "super_proxy"
description = "Proksi on hyper: a batteries-included reverse proxy with automatic HTTPS and Let's Encrypt."
version = "0.6.1"
edition = "2021"
license = "MIT OR Apache-2.0"
keywords = ["proxy", "https", "reverse-proxy", "load-balancer", "hyper"]
categories = ["web-programming::http-server", "network-programming"]
exclude = [
    "*.yaml",
    "*.yml",
    "*.toml",
    "src/*.md",
    "examples/",
    "dist/",
    "docs/",
    "target/",
    "tests/",
    "assets/",
    "tmp/",
    "Makefile",
    "Dockerfile",
    "gitbook/",
    ".github/",
]
authors = ["The Super Contributors"]
readme = "../../README.md"
homepage = "https://superproxy.dev"
repository = "https://github.com/luizfonseca/super"
rust-version.workspace = true
workspace = "../.."

[features]
default = ["kubernetes"]
# Kubernetes ingress controller (ADR 0005)
kubernetes = ["dep:kube", "dep:k8s-openapi", "dep:futures-util"]
store-sqlite = ["super_store/sqlite"]
store-postgres = ["super_store/postgres"]
# mimalloc instead of the system's allocator: faster with many threads (each keeps its own
# heap), for memory given back later once traffic drops
mimalloc = ["dep:mimalloc"]

[dependencies]
TinyUFO = "0.9.0"
super_admin_ui = { path = "../super_admin_ui", version = "0.6.1" }
acme-v2 = "1.0.0"
anyhow = "1.0.104"
arc-swap = "1.9.3"
schemars = "1.2.3"
async-trait = "0.1.92"
bollard = "0.21.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "cargo"] }
dashmap = "6.2.1"
figment = { version = "0.10.19", features = ["env"] }
# YAML configurations (figment's own YAML uses the deprecated `serde_yaml`)
serde-saphyr = "2.0.0"
hcl-rs = "0.19.9"
http = "1.5.0"
ipnet = "2.12.2"
nix = { version = "0.31.3", features = ["signal", "hostname", "process", "resource", "feature"] }
notify = { version = "8.2.1", default-features = false, features = [
    "fsevent-sys",
] }
num_cpus = "1.17.0"
once_cell = "1.21.4"
openssl = { version = "0.10", features = ["vendored"] }
papaya = "0.2.5"
super_plugins = { path = "../super_plugins", version = "0.6.1" }
super_core = { path = "../super_core", version = "0.6.1" }
super_store = { path = "../super_store", version = "0.6.1" }
path-tree = "0.8.3"
prometheus = "0.14.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "native-tls-no-alpn", "charset", "http2", "system-proxy"] }
seize = "0.5.1"
serde = "1.0.229"
serde_json = "1.0.154"
redis = { version = "1.8.0", features = ["r2d2"] }
r2d2 = { version = "0.8.10" }
time = { version = "0.3.55", features = ["macros", "formatting"] }
tokio = { version = "1.54.1", features = [
    "sync",
    "rt-multi-thread",
    "fs",
    "io-std",
    "macros",
    "process",
    "signal",
] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
uuid = { version = "1.29.0", features = ["v4"] }
rand = "0.10"
kube = { version = "4.2.0", default-features = false, features = ["client", "openssl-tls", "runtime"], optional = true }
k8s-openapi = { version = "0.28.0", features = ["v1_32"], optional = true }
futures-util = { version = "0.3.34", optional = true }
dns-lookup = "4.0.2"
regex = "1"
regex-automata = "0.4"
# Lists of values in rules, searched at once (already in the tree through regex)
aho-corasick = "1"
mimalloc = { version = "0.1.52", optional = true }
# wasmtime = "31.0.0"

[[bin]]
name = "super"
path = "src/main.rs"

[[bench]]
name = "dashmap_arc"
harness = false
path = "../../benches/dashmap_arc.rs"

[dev-dependencies]
# Signs the tokens of the jwt tests
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
super_plugins = { path = "../super_plugins", version = "0.6.1", features = ["test-util"] }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"] }
super_store = { path = "../super_store", version = "0.6.1", features = ["test-util"] }
criterion = { version = "0.8.2", features = ["html_reports"] }
figment = { version = "0.10.19", features = ["toml", "env", "test"] }
futures-util = "0.3.34"
# Websockets over HTTP/2 (extended CONNECT), as browsers open them
# And the HTTPS service of the tests (HTTP/2 or HTTP/1.1)
hyper = { version = "1.12", features = ["client", "server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-openssl = "0.6.5"
# HTTP/3 clients
h3 = "0.0.8"
h3-quinn = "0.0.10"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
bytes = "1"
native-tls = { version = "0.2.18", features = ["alpn"] }
# Tests' clients also negotiate HTTP/2, as browsers do
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "http2"] }
nix = { version = "0.31.3", features = ["signal", "resource"] }
# The nesting check (tests/nesting.rs) reads the sources
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "3", features = ["full", "visit"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["macros", "net", "io-util", "time"] }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
jsonschema = { version = "0.60", default-features = false }

[lints]
workspace = true
