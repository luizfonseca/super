[package]
name = "super_store"
description = "The stores shared by Super (and Proksi) replicas: routes, certificates, leases and replica reports."
version = "0.3.1"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["The Super Contributors"]
homepage = "https://github.com/luizfonseca/super"
repository = "https://github.com/luizfonseca/super"
rust-version.workspace = true
workspace = "../.."

[features]
# Certificates for tests, used by Proksi's tests
test-util = []
sqlite = ["dep:sqlx", "sqlx/sqlite"]
postgres = ["dep:sqlx", "sqlx/postgres", "sqlx/tls-native-tls"]

[dependencies]
async-trait = "0.1.92"
openssl = { version = "0.10", features = ["vendored"] }
papaya = "0.2.5"
r2d2 = "0.8"
redis = { version = "1.8.0", features = ["r2d2"] }
seize = "0.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["any", "macros", "migrate", "runtime-tokio"], optional = true }
tokio = { version = "1.54.1", features = ["rt-multi-thread"] }
tracing = "0.1.44"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
