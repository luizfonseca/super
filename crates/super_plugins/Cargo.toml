[package]
name = "super_plugins"
description = "Super's built-in plugins (Proksi's): authentication, limits, CORS, redirects, static files and more."
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["The Super Contributors"]
homepage = "https://github.com/luizfonseca/super"
repository = "https://github.com/luizfonseca/super"
rust-version.workspace = true
workspace = "../.."

[features]
# The counting allocator of tests that check the hot path doesn't allocate, used by Super's tests
test-util = ["super_core/test-util"]

[dependencies]
anyhow = "1.0.104"
arc-swap = "1.9.3"
async-trait = "0.1.92"
base64 = "0.23"
bytes = "1.12.1"
cookie = { version = "0.18.2", features = ["private"] }
http = "1.5.0"
httpdate = "1.0.3"
ipnet = "2.12.2"
itertools = "0.15.0"
memchr = "2"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
memmap2 = "0.9"
openssl = { version = "0.10", features = ["vendored"] }
path-tree = "0.8.3"
super_core = { path = "../super_core", version = "0.2.0" }
super_store = { path = "../super_store", version = "0.2.0" }
rand = "0.10"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "native-tls-no-alpn", "charset", "http2", "system-proxy"] }
short-crypt = "1.0.30"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = "2.0.0"
tempfile = "3.27.0"
time = { version = "0.3.55", features = ["macros"] }
tokio = { version = "1.54.1", features = ["sync", "time"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4"] }
aws-lc-rs = "1.18.2"

[dev-dependencies]
super_core = { path = "../super_core", version = "0.2.0", features = ["test-util"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }

[lints]
workspace = true
